# MySQL datasource configuration (replace placeholders as needed)
spring.datasource.url=jdbc:mysql://localhost:3306/rbac_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Show SQL statements (optional for debugging)
spring.jpa.show-sql=true

# Thymeleaf cache disabled for development
spring.thymeleaf.cache=false
